# Koyeb Configuration
# Reference: https://www.koyeb.com/docs/reference/koyeb-yaml
version: "1.0"
services:
  - name: cinegram-backend
    type: web
    image: github.com/MozamAnsari/CineGram
    branch: main
    build:
      builder: docker
      dockerfile: backend/Dockerfile
      workdir: backend
    ports:
      - port: 3000
        protocol: http
    routes:
      - path: /
        port: 3000
    regions:
      - fra
    instance_type: nano
    scalings:
      min: 1
      max: 1
